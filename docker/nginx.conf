# Limitacion de tasa por IP de cliente (contador unico compartido por todos los workers de la API).
# 5 solicitudes/s sostenidas con rafagas de hasta 60 (una pagina completa realiza ~10 llamadas).
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=5r/s;
# Endpoints sensibles (ingreso de analistas y alta de suscripciones): 10 solicitudes por minuto y rafaga de 5,
# para frenar la prueba masiva de contrasenas y el uso del formulario para enviar correos no solicitados.
limit_req_zone $binary_remote_addr zone=sensible:10m rate=10r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 "ok"; }

  # IP real del cliente: solo se confia en X-Forwarded-For si la conexion viene del proxy de produccion (Caddy, IP fija).
  # Confiar en toda la red privada permitia que un cliente conectado por la puerta de enlace de Docker declarara
  # cualquier IP y evadiera los limites de tasa. Por defecto (sin proxy) no se confia en ninguna direccion externa.
  set_real_ip_from ${SATO_PROXY_CONFIABLE};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location ~ ^/api/v1/(auth/login|suscripciones)$ {
    limit_req zone=sensible burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # se reemplaza (no se agrega) la cadena recibida: la API solo ve la IP real ya resuelta por real_ip
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_ip burst=60 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # se reemplaza (no se agrega) la cadena recibida: la API solo ve la IP real ya resuelta por real_ip
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 30d;
    # add_header dentro de un location reemplaza los del bloque server: se repiten las cabeceras de seguridad
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
