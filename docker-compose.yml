# SATO: plataforma completa en local
#   cp .env.example .env   (editar secretos)
#   docker compose up -d --build db api web
#   docker compose --profile carga run --rm cargador   (carga/actualiza la BD desde data/ y artifacts/)
# Abrir http://localhost:8080
name: sato-aqp

services:
  db:
    image: postgres:16-alpine
    # memoria compartida para operaciones paralelas (VACUUM de indices, consultas en paralelo); Docker asigna 64 MB por defecto
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sato}
      POSTGRES_USER: ${POSTGRES_USER:-sato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sato} -d ${POSTGRES_DB:-sato}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      SATO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sato}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sato}
      SATO_JWT_SECRET: ${SATO_JWT_SECRET:?definir SATO_JWT_SECRET en .env}
      SATO_ENV: prod
      SATO_CORS_ORIGINS: ${SATO_CORS_ORIGINS:-http://localhost:8080}
      SATO_RATE_LIMIT: ${SATO_RATE_LIMIT:-120/minute}
      SATO_BASE_URL: ${SATO_BASE_URL:-http://localhost:8080}
      SATO_SMTP_HOST: ${SATO_SMTP_HOST:-}
      SATO_SMTP_PORT: ${SATO_SMTP_PORT:-587}
      SATO_SMTP_USER: ${SATO_SMTP_USER:-}
      SATO_SMTP_PASSWORD: ${SATO_SMTP_PASSWORD:-}
      SATO_SMTP_FROM: ${SATO_SMTP_FROM:-}
      SATO_OUTBOX: /app/artifacts/outbox
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports:
      # solo en la maquina local por defecto (IPv4 e IPv6: "localhost" resuelve primero a ::1 en Windows);
      # en un servidor publico se usa Caddy (deploy/docker-compose.prod.yml)
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
      - "${WEB_BIND6:-[::1]}:${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

  cargador:
    profiles: ["carga"]
    build: { context: ., dockerfile: docker/pipeline.Dockerfile }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sato}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sato}
      SATO_CARGA_CAIDA_MAX: ${SATO_CARGA_CAIDA_MAX:-0.2}
      SATO_ADMIN_EMAIL: ${SATO_ADMIN_EMAIL:-}
      SATO_ADMIN_PASSWORD: ${SATO_ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    depends_on:
      db: { condition: service_healthy }

  # Sincronizacion mensual automatica con las fuentes oficiales y resumen semanal por correo.
  #   docker compose --profile worker up -d worker
  # Los embeddings de texto (GPU) no se recalculan aqui; ver sato/cron_runner.py.
  worker:
    profiles: ["worker"]
    build: { context: ., dockerfile: docker/pipeline.Dockerfile }
    command: ["sato.cron_runner"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sato}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sato}
      SATO_SYNC_DIA: ${SATO_SYNC_DIA:-2}
      SATO_SYNC_MAX_INTENTOS: ${SATO_SYNC_MAX_INTENTOS:-3}
      SATO_ALERTAS_EMAIL: ${SATO_ALERTAS_EMAIL:-}
      SATO_CARGA_CAIDA_MAX: ${SATO_CARGA_CAIDA_MAX:-0.2}
      SATO_BASE_URL: ${SATO_BASE_URL:-http://localhost:8080}
      SATO_SMTP_HOST: ${SATO_SMTP_HOST:-}
      SATO_SMTP_PORT: ${SATO_SMTP_PORT:-587}
      SATO_SMTP_USER: ${SATO_SMTP_USER:-}
      SATO_SMTP_PASSWORD: ${SATO_SMTP_PASSWORD:-}
      SATO_SMTP_FROM: ${SATO_SMTP_FROM:-}
      SATO_OUTBOX: /app/artifacts/outbox
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
