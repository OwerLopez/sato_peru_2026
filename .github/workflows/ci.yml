name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sato
          POSTGRES_USER: sato
          POSTGRES_PASSWORD: sato
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sato" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check sato tests research docs
      - name: Migraciones sobre PostgreSQL limpio
        env:
          DATABASE_URL: postgresql://sato:sato@127.0.0.1:5432/sato
        run: python -c "import psycopg; from sato.serving.load_db import migrate, dsn; c=psycopg.connect(dsn()); migrate(c); c.commit()"
      - name: Pruebas (unitarias, migraciones y restricciones; las que requieren los datos cargados se omiten)
        env:
          SATO_DATABASE_URL: postgresql+psycopg://sato:sato@127.0.0.1:5432/sato
        run: pytest -q
      - name: Auditoria de dependencias Python
        run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-api.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml build api web
        env:
          POSTGRES_PASSWORD: ci
          SATO_JWT_SECRET: ci-secret-with-more-than-thirty-two-characters
